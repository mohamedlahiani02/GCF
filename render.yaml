services:
  - type: web
    name: axelia-demo
    runtime: node
    plan: free
    region: frankfurt
    branch: feat/finance-demo-axelia
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: cd apps/api && node --import tsx src/db/migrate.ts && node --import tsx src/server.ts
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.23.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_DIST_DIR
        value: ../web/dist
      - key: PORTAL_DIST_DIR
        value: ../portal/dist
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PUBLIC_ORIGIN
        value: https://demo.axelia.software
